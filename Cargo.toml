[package]
name = "openhandle"
version = "1.2.6"
edition = "2024"
rust-version = "1.85"
description = "Official Rust SDK for the Openhandle social data API"
license = "MIT"
repository = "https://github.com/openhandlehq/openhandle-rust"
homepage = "https://openhandle.dev"
documentation = "https://docs.rs/openhandle"
readme = "README.md"
keywords = ["openhandle", "social-media", "instagram", "tiktok", "api"]
categories = ["api-bindings", "web-programming::http-client"]
include = [
    "/CHANGELOG.md",
    "/LICENSE",
    "/README.md",
    "/openapi/**",
    "/src/**",
    "/testdata/**",
    "/tests/**",
]

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["serde", "std"] }
futures-core = "0.3.31"
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "rustls", "system-proxy"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["time"] }

[dev-dependencies]
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
