name: Publish

on:
    push:
        tags: ['v*']

permissions:
    contents: read
    id-token: write

jobs:
    crates-io:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        environment: crates-io
        steps:
            - uses: actions/checkout@v7
            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy, rustfmt
            - run: cargo xtask generate --check
            - run: cargo fmt --check
            - run: cargo clippy --all-targets --locked -- -D warnings
            - run: cargo test --locked
            - name: Verify tag matches crate and contract version
              id: version
              run: |
                  crate_version="$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name == "openhandle") | .version')"
                  contract_version="$(jq -r '.info.version' openapi/openhandle.json)"
                  test "$GITHUB_REF_NAME" = "v$crate_version"
                  test "$crate_version" = "$contract_version"
                  echo "crate-version=$crate_version" >> "$GITHUB_OUTPUT"
            - name: Check whether version is already published
              id: registry
              env:
                  CRATE_VERSION: ${{ steps.version.outputs.crate-version }}
              run: |
                  if curl --fail --silent --show-error \
                      --user-agent 'openhandle-rust publish (https://github.com/openhandlehq/openhandle-rust)' \
                      "https://crates.io/api/v1/crates/openhandle/$CRATE_VERSION" >/dev/null 2>&1; then
                      echo "exists=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "exists=false" >> "$GITHUB_OUTPUT"
                  fi
            - name: Authenticate to crates.io with OIDC
              if: steps.registry.outputs.exists != 'true'
              id: auth
              uses: rust-lang/crates-io-auth-action@v1
            - name: Publish to crates.io
              if: steps.registry.outputs.exists != 'true'
              env:
                  CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
              run: cargo publish --locked
